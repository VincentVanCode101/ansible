---
- name: Snap-Packages | Install applications via Snap
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Snap-Packages | Ensure snapd is installed
      ansible.builtin.package:
        name: snapd
        state: present

    - name: Snap-Packages | Install Shotcut from the Snap Store
      community.general.snap:
        name: shotcut
        classic: yes
        state: present

    - name: Snap-Packages | Install Telegram from the Snap Store
      community.general.snap:
        name: telegram-desktop
        state: present

    - name: Snap-Packages | Install iCloud applications from the Snap Store
      community.general.snap:
        name: icloud-for-linux
        state: present

    - name: Snap-Packages | Install rpi-imager from the Snap Store
      community.general.snap:
        name: rpi-imager
        state: present