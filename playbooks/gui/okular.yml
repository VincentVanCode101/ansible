---
- name: Okular | Install pdf-reader (okular)
  hosts: localhost
  connection: local
  become: true

  pre_tasks:
    - name: Update APT cache
      ansible.builtin.include_role:
        name: update_apt

  tasks:
    - name: Okular | Install pdf-reader (okular)
      become: true
      ansible.builtin.apt:
        name: ["okular"]
        state: present
