---
- name: Obsidian | Clean up old install and install via Snap
  hosts: localhost
  become: true

  tasks:
    - name: Obsidian | Remove old Obsidian .deb package (if any)
      apt:
        name: obsidian
        state: absent

    - name: Obsidian | Find Obsidian binary location
      command: whereis obsidian
      register: whereis_obsidian
      changed_when: false

    - name: Obsidian | Remove leftover Obsidian binaries
      file:
        path: "{{ item }}"
        state: absent
      with_items: "{{ whereis_obsidian.stdout.split()[1:] }}"
      when: whereis_obsidian.stdout != 'obsidian:'

    - name: Obsidian | Ensure snapd is installed
      apt:
        name: snapd
        state: present
        update_cache: yes

    - name: Obsidian | Install Obsidian via snap (classic confinement)
      community.general.snap:
        name: obsidian
        classic: yes
        state: present
      args:
        creates: /snap/bin/obsidian  # Prevents re-running if already installed
