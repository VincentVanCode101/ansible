---
- name: second-brain | Setup second brain autosync service
  hosts: localhost
  become: true
  vars_files:
    - ../../vars.yml

  pre_tasks:
    - name: Determine OS family
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_system == 'Linux' }}"
        is_darwin: "{{ ansible_system == 'Darwin' }}"

  vars:
    # Directly clone via SSH using the alias configured in my SSH config.
    repo_url_ssh: "git@github.com-second-brain:VincentVanCode101/second-brain.git"
    repo_dest: "{{ personal_notes_path }}/second-brain"
    service_src: "../../../resources/second-brain-autosync.service"
    service_dest: "/etc/systemd/system/second-brain-autosync.service"
    mac_service_src: "../../../resources/second-brain-autosync.plist"
    mac_service_dest: "/Users/christoph/Library/LaunchAgents/com.secondbrain.autosync.plist"


  tasks:
    - name: Fail if unsupported OS
      ansible.builtin.fail:
        msg: "This playbook is only supported on Linux or macOS."
      when: ansible_system not in ['Linux', 'Darwin']

    # Linux-specific tasks
    - name: second-brain - Linux | Ensure Git is installed
      ansible.builtin.apt:
        name: git
        state: present
      when: is_linux
      become: true

    - name: second-brain - Linux | Install inotify-tools
      ansible.builtin.apt:
        name: inotify-tools
        state: present
      when: is_linux
      become: true

    - name: second-brain - Linux | Clone the second-brain repository via SSH
      ansible.builtin.git:
        repo: "{{ repo_url_ssh }}"
        dest: "{{ repo_dest }}"
        version: "main"
        force: yes
        accept_hostkey: yes
      become: false
      environment:
        HOME: "{{ lookup('env','HOME') }}"

    - name: second-brain - Linux | Copy second-brain-autosync.service file to systemd directory
      ansible.builtin.copy:
        src: "{{ service_src }}"
        dest: "{{ service_dest }}"
        owner: root
        group: root
        mode: "0644"
      when: is_linux

    - name: second-brain - Linux | Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      when: is_linux

    - name: second-brain - Linux | Enable and start second-brain-autosync service
      ansible.builtin.systemd:
        name: second-brain-autosync.service
        enabled: yes
        state: started
      when: is_linux

    # macOS-specific tasks
    - name: second-brain - macOS | Clone the second-brain repository via SSH
      ansible.builtin.git:
        repo: "{{ repo_url_ssh }}"
        dest: "{{ repo_dest }}"
        version: "main"
        force: yes
        accept_hostkey: yes
      become: false
      environment:
        HOME: "{{ lookup('env','HOME') }}"
      when: is_darwin

    - name: second-brain - macOS | Copy second-brain-autosync.plist to LaunchAgents directory
      ansible.builtin.copy:
        src: "{{ mac_service_src }}"
        dest: "{{ mac_service_dest }}"
        group: staff
        mode: "0644"
      become: false
      when: is_darwin

    - name: second-brain - macOS | Load LaunchAgent with launchctl load
      ansible.builtin.shell: "launchctl load '{{ mac_service_dest }}'"
      become: false
      when: is_darwin

    - name: second-brain - macOS | Start LaunchAgent (kickstart)
      ansible.builtin.shell: "launchctl start com.secondbrain.autosync"
      become: false
      when: is_darwin

# To manually restart:
# launchctl unload ~/Library/LaunchAgents/com.secondbrain.autosync.plist                                                                                                      ✔  11:20:58 AM
# launchctl load ~/Library/LaunchAgents/com.secondbrain.autosync.plist
# launchctl kickstart -k gui/$(id -u)/com.secondbrain.autosync
