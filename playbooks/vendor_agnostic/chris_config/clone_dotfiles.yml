---
- name: Dotfiles | Set up my dotfiles
  hosts: localhost
  connection: local
  vars_files:
    - ../../vars.yml

  pre_tasks:
    - name: Determine OS family
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
        is_darwin: "{{ ansible_facts['system'] == 'Darwin' }}"

    - name: Dotfiles | Update APT cache
      ansible.builtin.include_role:
        name: update_apt
      when: is_linux

  tasks:
    - name: Dotfiles |Installing stow
      become: true
      ansible.builtin.apt:
        name: stow
      when: is_linux

    - name: Dotfiles | Cloning dotfiles
      become: false
      become_user: "{{ current_user }}"
      ansible.builtin.git:
        repo: 'git@github.com:VincentVanCode101/dotfiles.git'
        dest: "{{ lookup('env', 'HOME') }}/dotfiles"
        recursive: yes
        update: yes
        accept_hostkey: yes
        version: main

    - name: Dotfiles | Clean environment by removing existing unstowing & removing dotfiles
      ansible.builtin.shell: cd $HOME/dotfiles && ./ubuntu --clean-env
      args:
        executable: /bin/zsh

    - name: Dotfiles | Stow dotfiles
      ansible.builtin.shell: cd $HOME/dotfiles && ./ubuntu --install
      args:
        executable: /bin/zsh
