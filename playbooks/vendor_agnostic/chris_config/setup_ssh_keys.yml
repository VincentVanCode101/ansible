---
- name: SSH-Keys | Provision private and public keys
  hosts: localhost
  connection: local
  vars_files:
    - ../../vars.yml

  vars:
    ssh_key_dir: "{{ lookup('env', 'HOME') }}/.ssh"
    source_key_dir: "{{ playbook_dir }}/../../../resources/.ssh"

  tasks:
    - name: SSH Keys | Ensure .ssh directory exists
      ansible.builtin.file:
        path: "{{ ssh_key_dir }}"
        state: directory
        mode: '0700'

    - name: SSH Keys | Install SSH keys
      ansible.builtin.copy:
        src: "{{ source_key_dir }}/{{ item }}"
        dest: "{{ ssh_key_dir }}/{{ item }}"
        mode: '0600'
      loop: "{{ ssh_keys }}"

    - name: SSH Keys | Install SSH public keys
      ansible.builtin.copy:
        src: "{{ source_key_dir }}/{{ item }}.pub"
        dest: "{{ ssh_key_dir }}/{{ item }}.pub"
        mode: '0644'
      loop: "{{ ssh_keys }}"

    - name: SSH Keys | Set authorized keys from file
      ansible.builtin.authorized_key:
        user: "{{ current_user }}"
        state: present
        key: "{{ lookup('file', ssh_key_dir ~ '/' ~ item ~ '.pub') }}"
      loop: "{{ ssh_keys }}"