---
- name: Passwordless Sudo | Configure passwordless sudo for the current user
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - ../../vars.yml

  tasks:
    - name: Passwordless Sudo - Linux | Ensure user can execute sudo commands without a password
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ current_user }}"
        line: "{{ current_user }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
      when: ansible_facts['system'] == 'Linux'

    - name: Passwordless Sudo - MacOS | Ensure user can execute sudo commands without a password
      ansible.builtin.lineinfile:
        path: "/etc/sudoers"
        regexp: '^{{ current_user }}\s'
        line: "{{ current_user }} ALL=(ALL) NOPASSWD:ALL"
        state: present
        validate: '/usr/sbin/visudo -cf %s'
      when: ansible_facts['system'] == 'Darwin'
