---
- name: Ctop | Install docker-ctop (Linux & macOS)
  hosts: localhost
  become: true

  tasks:
    - name: Ctop | Download ctop binary (Linux)
      ansible.builtin.get_url:
        url: https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-linux-amd64
        dest: /usr/local/bin/ctop
        mode: '0755'
      when: ansible_system == 'Linux'

    - name: Ctop | Install ctop via Homebrew (macOS)
      ansible.builtin.command: brew install ctop
      become: false
      when: ansible_system == 'Darwin'
