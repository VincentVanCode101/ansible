---
- name: FZF | Install Fuzzyfinder
  hosts: localhost

  vars_files:
    - ../../vars.yml

  pre_tasks:
    - name: Determine OS family
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_system == 'Linux' }}"
        is_darwin: "{{ ansible_system == 'Darwin' }}"

  tasks:
    - name: FZF | Install special packages (fzf) # Apt version of fzf is way to old
      become: false
      become_user: "{{ current_user}}"
      ansible.builtin.git:
        repo: 'https://github.com/junegunn/fzf.git'
        dest: "{{ lookup('env', 'HOME') }}/.fzf"
        depth: 1
      when: is_linux
    
    - name: FZF - macOS | Install fzf via brew
      become: false
      become_user: "{{ current_user }}"
      community.general.homebrew:
        name: fzf
        state: present
      when: is_darwin