---
- name: KeePassXC | Install KeePassXC cross-platform
  hosts: localhost
  become: false

  pre_tasks:
    - name: Determine OS family
      ansible.builtin.set_fact:
        is_linux: "{{ ansible_system == 'Linux' }}"
        is_darwin: "{{ ansible_system == 'Darwin' }}"

  tasks:
    - name: Fail if unsupported OS
      ansible.builtin.fail:
        msg: "KeePassXC installation is only supported on Linux or macOS."
      when: ansible_system not in ['Linux', 'Darwin']

    - name: KeePassXC - Linux | Update APT cache
      include_role:
        name: update_apt
      when: is_linux

    - name: KeePassXC - Linux | Add KeePassXC PPA
      ansible.builtin.apt_repository:
        repo: ppa:phoerious/keepassxc
        state: present
      when: is_linux
      become: true

    - name: KeePassXC - Linux | Install KeePassXC
      ansible.builtin.apt:
        name: keepassxc
        state: present
        update_cache: yes
      when: is_linux
      become: true

    - name: KeePassXC - macOS | Install or upgrade KeePassXC via Homebrew
      community.general.homebrew_cask:
        name: keepassxc
        state: latest
      when: is_darwin
