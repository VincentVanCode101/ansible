---
- name: Obsidian | Install on Linux or macOS
  hosts: localhost
  become: true
  gather_facts: yes

  vars:
    is_linux: "{{ ansible_system == 'Linux' }}"
    is_darwin: "{{ ansible_system == 'Darwin' }}"

  tasks:

    # --- Linux Snap installation ---
    - name: Obsidian | Remove old Obsidian .deb package (Linux only)
      ansible.builtin.apt:
        name: obsidian
        state: absent
      when: is_linux

    - name: Obsidian | Find Obsidian binary location (Linux only)
      ansible.builtin.command: whereis obsidian
      register: whereis_obsidian
      changed_when: false
      when: is_linux

    - name: Obsidian | Remove leftover Obsidian binaries (Linux only)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ whereis_obsidian.stdout.split()[1:] }}"
      when:
        - is_linux
        - whereis_obsidian.stdout != 'obsidian:'

    - name: Obsidian | Ensure snapd is installed (Linux only)
      ansible.builtin.package:
        name: snapd
        state: present
        update_cache: yes
      when: is_linux

    - name: Obsidian | Install Obsidian via snap (classic confinement, Linux only)
      community.general.snap:
        name: obsidian
        classic: yes
        state: present
      when: is_linux

    # --- macOS DMG installation ---
    - block:
        - name: Obsidian | Create temporary directory for download
          ansible.builtin.file:
            path: /tmp/obsidian_install
            state: directory
            mode: '0755'

        - name: Obsidian | Download Obsidian DMG
          ansible.builtin.get_url:
            url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.8.10/Obsidian-1.8.10.dmg"
            dest: /tmp/obsidian_install/Obsidian.dmg
            mode: '0644'

        - name: Obsidian | Attach Obsidian DMG
          ansible.builtin.command:
            cmd: hdiutil attach /tmp/obsidian_install/Obsidian.dmg -nobrowse
          register: attach_result

        - name: Obsidian | Find Obsidian.app in mounted volume
          ansible.builtin.find:
            paths: /Volumes
            patterns: "Obsidian.app"
            recurse: yes
            file_type: directory
          register: obsidian_app

        - name: Obsidian | Fail if Obsidian.app was not found
          ansible.builtin.fail:
            msg: "Obsidian.app not found in mounted DMG."
          when: obsidian_app.matched == 0

        - name: Obsidian | Copy Obsidian.app to /Applications
          ansible.builtin.command:
            cmd: cp -R "{{ obsidian_app.files[0].path }}" /Applications/
          args:
            creates: /Applications/Obsidian.app

        - name: Obsidian | Fix ownership of Obsidian.app
          ansible.builtin.file:
            path: /Applications/Obsidian.app
            owner: "{{ lookup('env', 'USER') }}"
            group: staff
            recurse: yes

        - name: Obsidian | Set mount_dir fact for detaching
          ansible.builtin.set_fact:
            mount_dir: "{{ obsidian_app.files[0].path | dirname }}"

        - name: Obsidian | Detach Obsidian DMG
          ansible.builtin.command:
            cmd: hdiutil detach "{{ mount_dir }}" -quiet

        - name: Obsidian | Clean up temporary directory
          ansible.builtin.file:
            path: /tmp/obsidian_install
            state: absent
      when: is_darwin

    # --- Message if unsupported OS ---
    - name: Obsidian | Unsupported OS message
      ansible.builtin.debug:
        msg: "This playbook supports only Linux (via Snap) or macOS (via DMG)."
      when:
        - not is_linux
        - not is_darwin
