---
- name: UFW | Install and configure UFW firewall (Tailscale Zero Trust)
  hosts: localhost
  become: true

  pre_tasks:
    - name: UFW | Update APT cache
      include_role:
        name: update_apt

  tasks:
    - name: UFW | Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: UFW | Set default policies (Deny incoming, Allow outgoing)
      community.general.ufw:
        direction: "{{ item.dir }}"
        policy: "{{ item.pol }}"
      loop:
        - { dir: 'incoming', pol: 'deny' }
        - { dir: 'outgoing', pol: 'allow' }

    - name: UFW | Allow traffic from Tailscale Interface
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        comment: "Zero Trust: Trust only encrypted Tailscale traffic"

    - name: UFW | Enable UFW and start on boot
      community.general.ufw:
        state: enabled