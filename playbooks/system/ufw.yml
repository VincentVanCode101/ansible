---
- name: UFW | Install and enable UFW firewall
  hosts: localhost
  become: true

  pre_tasks:
    - name: UFW | Update APT cache
      include_role:
        name: update_apt

  tasks:
    - name: UFW | Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: UFW | Enable UFW
      ansible.builtin.shell: |
        sudo ufw enable

    - name: UFW | Ensure UFW is enabled
      ansible.builtin.shell: |
        sudo ufw status | grep -E -q 'Status: (active|aktive)'
      register: ufw_status_check
      changed_when: false
      failed_when: ufw_status_check.rc != 0
