---
- name: Install R on Ubuntu
  hosts: localhost
  become: true
  vars:
    cran_key_id: "E298A3A825C0D65DFD57CBB651716619E084DAB9"
    cran_repo: "deb https://cloud.r-project.org/bin/linux/ubuntu {{ ansible_lsb.codename }}-cran40/"

  pre_tasks:
    - name: Update APT cache
      include_role:
        name: update_apt

  tasks:
    - name: Ensure apt-transport-https is installed
      apt:
        name: apt-transport-https
        state: present

    - name: Add CRAN GPG key
      apt_key:
        keyserver: keyserver.ubuntu.com
        id: "{{ cran_key_id }}"
        state: present

    - name: Add CRAN repository for R
      apt_repository:
        repo: "{{ cran_repo }}"
        state: present
        filename: "cran-r"

    - name: Install R base package
      apt:
        name: r-base
        state: present
      tags: install

    - name: Install R base dev package
      apt:
        name: r-base-dev
        state: present
      tags: install

    - name: Verify R installation
      command: R --version
      register: r_version
      changed_when: false

    - name: Show R version
      debug:
        msg: "{{ r_version.stdout_lines[0] }}"
