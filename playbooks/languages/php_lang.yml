---
- name: PHP | Install php
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - ../vars.yml

  pre_tasks:
    - name: PHP | Update APT cache
      ansible.builtin.include_role:
        name: update_apt

  tasks:
    - name: PHP | Install php
      ansible.builtin.apt:
        name: php
        state: present
